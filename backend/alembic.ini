# A generic, single database configuration.

[alembic]
# path to migration script
script_location = backend/alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepended_sys_path = .

# timezone to use when rendering the date within the migration file as
# well as the filename.
# timezone =

# max length of characters in file_template
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; this defaults
# to alembic/versions. When multiple version
# directories are required, specify names separated by spaces
# or newlines.
# version_locations = %(here)s/bar %(here)s/bat alembic/versions

# set to 'true' to search source files recursively;
# version_locations = alembic/versions
# version_path_separator = :

# set to 'true' to search source files recursively;
# recursive_version_locations = false

# the output encoding used when revision files are written
# output_encoding = utf-8

sqlalchemy.url = postgresql+asyncpg://foodguard_user:foodguard_password@localhost:5432/foodguard

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
