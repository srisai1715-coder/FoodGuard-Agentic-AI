services:
  db:
    image: postgres:16-alpine
    container_name: foodguard-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodguard}
      POSTGRES_USER: ${POSTGRES_USER:-foodguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodguard_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-foodguard_user} -d $${POSTGRES_DB:-foodguard}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodguard-backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodguard}
      POSTGRES_USER: ${POSTGRES_USER:-foodguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodguard_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-foodguard_user}:${POSTGRES_PASSWORD:-foodguard_password}@db:5432/${POSTGRES_DB:-foodguard}
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodguard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: